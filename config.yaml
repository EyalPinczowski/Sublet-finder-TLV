# Facebook groups to monitor. Use the group's numeric ID or the URL slug
# exactly as it appears in the group's Facebook URL.
facebook_groups:
  - name: "Secret Tel Aviv"
    url: "https://www.facebook.com/groups/SecretTelAviv"
  - name: "TLV Sublet Group"  # rename these to match each group's real title
    url: "https://www.facebook.com/groups/1253641912158395"
  - name: "TLV Sublet Group 2"
    url: "https://www.facebook.com/groups/327655587294381"
  - name: "TLV Sublet Group 3"
    url: "https://www.facebook.com/groups/892192804189635"
  - name: "TLV Sublet Group 4"
    url: "https://www.facebook.com/groups/278821486227658"

# How many posts to pull per group per run.
posts_per_group: 40

# LLM-based extraction (Gemini free tier) — far more reliable than the
# regex parser on colloquial Hebrew, and adds offer/seeker classification,
# a real one-line summary, and phone/address extraction. Falls back to the
# regex parser automatically when GEMINI_API_KEY is unset (see .env.example),
# the daily budget is spent, or a call errors — never a hard failure.
llm:
  enabled: true
  # Client-side ceiling so we stop before Google's own free-tier daily cap
  # (500 requests/day/model as of 2026). This tool's volume (a handful of
  # groups, one scan at a time) won't come close in normal use; this is a
  # safety margin, not a tuned value.
  daily_budget: 400
  # Minimum seconds between Gemini calls, to stay under the free tier's
  # requests-per-minute limit.
  min_interval_seconds: 4.5

# Zone scoring: how "close" a listing is to a place you care about,
# measured as straight-line distance (no walk-time/routing). A listing
# within max_distance_meters of the target counts as a location match even
# if its address text doesn't mention any of search.neighborhoods below.
zone:
  target_label: "Dizengoff Square"
  # Approximate — adjust to taste.
  target_lat: 32.0768
  target_lon: 34.7742
  max_distance_meters: 1000

# Your criteria for the apartment you're looking to sublet FROM someone.
# Posts offering a sublet (not seeking one) are checked against this with
# cheap local regex matching — no API calls, fully free.
search:
  price_min: 2500
  price_max: 3600
  min_rooms: null
  # Substring match (Hebrew or English), case-insensitive. Leave empty to
  # match any neighborhood.
  neighborhoods:
    - "כיכר דיזנגוף"
    - "כיכר דיזינגוף"
    - "dizengoff square"
    - "כרם התימנים"
    - "kerem hateimanim"
    - "kerem ha teimanim"
    - "הבימה"
    - "habima"
  # Posts containing any of these are dropped even if they mention sublets
  # (useful for filtering out false positives the keyword heuristic misses).
  excluded_keywords: []
  # Total roommates in the apartment (including you), max allowed.
  max_roommates: 3
  # Bathroom rule — a listing passes if ANY of these hold:
  #   - the apartment has at least min_bathrooms toilets
  #   - there's a toilet per roommate
  #   - the toilet and shower are separate rooms, and roommates <=
  #     separate_toilet_shower_max_roommates
  min_bathrooms: 2
  separate_toilet_shower_max_roommates: 3
